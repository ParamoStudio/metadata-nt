# cargo-deny configuration — Task 20 supply-chain gate.
# Scope: the macOS release target (the only v1 shipping target). Linux/Windows
# conditional dependencies (e.g. the GTK chain: glib/atk/gtk via muda) are
# excluded from the shipped graph; their advisories are documented in
# docs/THIRD_PARTY_LICENSES.md instead of silently ignored.

[graph]
targets = [{ triple = "aarch64-apple-darwin" }]
all-features = true

[advisories]
version = 2
db-path = "~/.cargo/advisory-dbs"
# No blanket ignores: with the macOS-only graph, RUSTSEC-2024-0429 (glib) and
# RUSTSEC-2024-0370 (proc-macro-error, glib-macros build lineage) fall out of
# the graph entirely. Any NEW advisory on a compiled dependency fails the gate.
ignore = []

[licenses]
version = 2
# The first-party crate's product license is an owner decision (undecided at
# Task 20 time); it is private/unpublished, so exempt it instead of guessing
# an SPDX expression into Cargo.toml.
private = { ignore = true }
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "LicenseRef-Proprietary",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
